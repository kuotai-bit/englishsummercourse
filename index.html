        // 16-35: Level Vocabulary (20%)
        const vocabQuestions = [
            { id: 16, text: "The ___ shows the declining working population, which is not good for the economy.", options: ["(A) anniversary", "(B) confusion", "(C) accent", "(D) diagram"], correct: 3, exp: "答案: (D) diagram (圖表)。\n💡 老師解析：句意為「『圖表』顯示勞動人口正在下降」。\n(A) 週年紀念 (B) 困惑 (C) 口音。\n【搭配詞】show/illustrate the diagram（展示圖表）、pie diagram（圓餅圖）。" },
            { id: 17, text: "The ancients used very ___ writing material like animal skin, which makes it difficult to read.", options: ["(A) coarse", "(B) continuous", "(C) desperate", "(D) critical"], correct: 0, exp: "答案: (A) coarse (粗糙的)。\n💡 老師解析：動物皮毛製成的書寫材料質地「粗糙」，導致不易閱讀。\n(B) 連續的 (C) 絕望的 (D) 關鍵的/批判的。\n【搭配詞】coarse texture（粗糙的質地）、coarse cloth（粗布）。" },
            { id: 18, text: "Nokia used to ___ the mobile phone market until the iPhone arrived.", options: ["(A) consist", "(B) boast", "(C) dominate", "(D) blend"], correct: 2, exp: "答案: (C) dominate (稱霸/主導)。\n💡 老師解析：諾基亞曾「主導/稱霸」手機市場。\n(A) 由...組成 (常接 of) (B) 自誇 (D) 混合。\n【搭配詞】dominate the market（稱霸市場）、dominate the industry（主導產業）。" },
            { id: 19, text: "Her words do not ___ to her actions. She says one thing and does another.", options: ["(A) clashed", "(B) correspond", "(C) appoint", "(D) bargain"], correct: 1, exp: "答案: (B) correspond (符合/對應)。\n💡 老師解析：correspond to/with 指「與...一致/符合」。後句「言行不一」(says one thing and does another) 是解題線索。\n(A) 衝突 (C) 指派 (D) 討價還價。" },
            { id: 20, text: "The company almost got ___ because of bad management practice.", options: ["(A) assemble", "(B) accomplished", "(C) chewed", "(D) bankrupt"], correct: 3, exp: "答案: (D) bankrupt (破產的)。\n💡 老師解析：get/go bankrupt 為固定用法，意為「破產」。\n(A) 集合/組裝 (B) 有造詣的 (C) 咀嚼的。\n【字根】bank(銀行) + rupt(破裂) -> 破產。" },
            { id: 21, text: "Labor and ___ must work together; that is, the workers and the owners of business must cooperate towards a common goal and not work against each other.", options: ["(A) capital", "(B) diploma", "(C) candidate", "(D) chamber"], correct: 0, exp: "答案: (A) capital (資方/資本)。\n💡 老師解析：Labor and capital 指「勞方與資方」。後文補充「the workers (勞工) and the owners of business (資方)」。\n(B) 文憑 (C) 候選人 (D) 房間/會議室。" },
            { id: 22, text: "A high school ___ is good enough to get hired in a factory; one doesn't need a college degree for that.", options: ["(A) chorus", "(B) diploma", "(C) draft", "(D) cue"], correct: 1, exp: "答案: (B) diploma (畢業文憑)。\n💡 老師解析：high school diploma (高中畢業證書)，與後文的 college degree (大學學位) 對應。\n(A) 合唱團 (C) 草稿 (D) 線索/提示。" },
            { id: 23, text: "The latest Samsung smartphone is very ___ and can be submerged in water without getting damaged, or even remains intact after falling from 50 feet.", options: ["(A) durable", "(B) courageous", "(C) classified", "(D) authentic"], correct: 0, exp: "答案: (A) durable (耐用的/持久的)。\n💡 老師解析：手機泡水不壞、高處墜落仍完好(remains intact)，代表其非常「耐用」。\n(B) 勇敢的 (C) 機密的 (D) 正宗的/真實的。" },
            { id: 24, text: "The Greeks ___ the city of Troy by sending their soldiers inside a gigantic wooden horse.", options: ["(A) accompanied", "(B) adapted", "(C) conquered", "(D) disguised"], correct: 2, exp: "答案: (C) conquered (征服/攻克)。\n💡 老師解析：希臘人藉由特洛伊木馬「攻克、征服」了特洛伊城。\n(A) 陪伴 (B) 適應/改編 (D) 喬裝/偽裝。" },
            { id: 25, text: "A call from an unknown person asking for his bank account ___ his suspicion that it was a scam.", options: ["(A) amused", "(B) circulated", "(C) annoyed", "(D) aroused"], correct: 3, exp: "答案: (D) aroused (激起/喚起)。\n💡 老師解析：arouse one's suspicion 是極具考相的搭配片語，意為「引起某人的懷疑」。\n(A) 逗樂 (B) 傳播 (C) 惹怒。" },
            { id: 26, text: "One can hardly ___ that Shakespeare was one of greatest playwright of the English language.", options: ["(A) abandon", "(B) acquaint", "(C) calculate", "(D) dispute"], correct: 3, exp: "答案: (D) dispute (爭論/否認)。\n💡 老師解析：hardly dispute 表「無庸置疑/難以否認」。莎士比亞是公認最偉大的劇作家之一。\n(A) 放棄 (B) 認識 (C) 計算。" },
            { id: 27, text: "The ___ for the US president is now heating up, with both candidates almost even in the recent polls.", options: ["(A) combination", "(B) campaign", "(C) constitution", "(D) cooperation"], correct: 1, exp: "答案: (B) campaign (競選活動)。\n💡 老師解析：the presidential campaign (總統競選運動)。後文 candidates 與 polls 為解題線索。\n(A) 結合 (C) 憲法 (D) 合作。" },
            { id: 28, text: "An argument ___ between Jack and Jane, because the former wanted spaghetti, while the latter wanted Chinese noodles for dinner.", options: ["(A) defended", "(B) deserved", "(C) arose", "(D) collapsed"], correct: 2, exp: "答案: (C) arose (產生/發生)。\n💡 老師解析：動詞原形為 arise，過去式為 arose。An argument arose 指「爆發了一場爭吵」。\n(A) 保衛 (B) 應得 (D) 倒塌。" },
            { id: 29, text: "The politician gave a very ___ remark when asked how he would solve the problem of poverty in the country; that is, his answer was really smart but fake.", options: ["(A) clumsy", "(B) atomic", "(C) ambitious", "(D) cunning"], correct: 3, exp: "答案: (D) cunning (狡黠的/精明但虛偽的)。\n💡 老師解析：破折號後的解釋 \"smart but fake\"（聰明卻虛偽）正是 cunning 的核心語義。\n(A) 笨拙的 (B) 原子的 (C) 有野心的。" },
            { id: 30, text: "He ___ to hear the news that his wife was diagnosed with cancer and had only a couple of months to live. He was afraid to face the truth.", options: ["(A) ceased", "(B) dreaded", "(C) clarified", "(D) blessing"], correct: 1, exp: "答案: (B) dreaded (懼怕/擔憂)。\n💡 老師解析：dread to V 指「害怕/不敢做某事」。後句 \"afraid to face the truth\" 提供明確佐證。\n(A) 停止 (C) 澄清 (D) 祝福。" },
            { id: 31, text: "If you want to be in business, you need to be ___ because honesty wins the trust of consumers.", options: ["(A) diligent", "(B) earnest", "(C) competitive", "(D) athletic"], correct: 1, exp: "答案: (B) earnest (真誠的/認真的)。\n💡 老師解析：由後方因果句 \"honesty wins trust\"（誠實贏得信任）可知商人需「真誠 (earnest)」待人。\n(A) 勤勉的 (C) 具競爭力的 (D) 運動的。" },
            { id: 32, text: "In the ___ of an eye, his 20 years of hard work was destroyed by one strong typhoon.", options: ["(A) authority", "(B) blossom", "(C) comment", "(D) blink"], correct: 3, exp: "答案: (D) blink (眨眼)。\n💡 老師解析：固定成語搭配 in the blink of an eye，意思為「轉眼之間/剎那間」。\n(A) 權威 (B) 花朵盛開 (C) 評論。" },
            { id: 33, text: "It is quite ___ that Mary has a crush on Michael, because she blushes whenever she hears Michael's name is mentioned.", options: ["(A) composed", "(B) apparent", "(C) convinced", "(D) delicate"], correct: 1, exp: "答案: (B) apparent (顯而易見的)。\n💡 老師解析：由後文「提到名字就臉紅」可知她暗戀 Michael 是「顯而易見的 (apparent)」。\n(A) 鎮定的 (C) 深信的 (D) 纖細的。" },
            { id: 34, text: "It is expected that the US economy can ___ back after the US presidential election, because it has been undergoing inflation for the past few months.", options: ["(A) devise", "(B) dismiss", "(C) bounce", "(D) concentrate"], correct: 2, exp: "答案: (C) bounce (彈跳)。\n💡 老師解析：慣用語 bounce back 意為「強勁反彈/復甦」。\n(A) 設計/想出 (B) 解雇/打發 (D) 專心。" },
            { id: 35, text: "The father joined the son on a camping trip, which created a stronger ___ between them.", options: ["(A) bond", "(B) bred", "(C) barrier", "(D) choked"], correct: 0, exp: "答案: (A) bond (情感連結/羈絆)。\n💡 老師解析：create/forge a strong bond between... 指「建立緊密深厚的情感牽絆」。\n(B) 繁殖 (過去式) (C) 隔閡/障礙 (D) 哽噎。" }
        ];

        const clozePassages = [
            {
                title: "Cloze 1: Ronald McDonald Hospital Visit (第36-40題)",
                intro: "Several years ago, while working for McDonald's, I participated in a community outreach service, often visiting [36] ill children at the local hospital. One particular rule prohibited me from visiting children alone or having physical contact, for my painted face and red wig might frighten them, and contact could [37] germs to them. One day, a fragile boy named Billy asked me for a hug after I did some magic tricks to cheer him up. Though turning down Billy's request pained me deeply, I had no choice but to submit to the rules. When I rose to my feet to leave, the hopeful look in his eyes [38] me to recognize that genuine affection and compassion could be most powerfully expressed through an empathetic and heartfelt embrace. All of a sudden, I no longer cared if I was [39] breaking the rules and hugged him right away. Little Billy then confided his worries to me and showed an extraordinary sense of selflessness. It seemed that he knew he would never be going home, [40] he was only thinking of his brother and dog. I was overwhelmed with emotion when Billy's mother called to inform me of his passing. I was grateful that I chose to break the rules and spend that time with him, which was truly unforgettable.",
                questions: [
                    { id: 36, options: ["(A) ridiculously", "(B) individually", "(C) terminally", "(D) beneficially"], correct: 2, exp: "答案: (C) terminally。\n💡 解析：terminally ill 指「罹患絕症/晚期的」。醫院病童罹患重症臨終，呼應後文 passing (逝世)。" },
                    { id: 37, options: ["(A) map out", "(B) confine to", "(C) suffer from", "(D) pass on"], correct: 3, exp: "答案: (D) pass on。\n💡 解析：pass on germs to sb 指「將細菌傳染給某人」。(A) 籌劃 (B) 限制於 (C) 承受受苦於。" },
                    { id: 38, options: ["(A) prompted", "(B) hesitated", "(C) erected", "(D) sparkled"], correct: 0, exp: "答案: (A) prompted。\n💡 解析：prompt sb to V 指「促使/驅使某人去做...」。男孩期盼的眼神促使作者領悟深層的同理心。" },
                    { id: 39, options: ["(A) about to catch", "(B) caught", "(C) got caught", "(D) being caught"], correct: 1, exp: "答案: (B) caught。\n💡 解析：was caught doing sth（被抓到正在做違規的事）。被動語態 was + p.p.。" },
                    { id: 40, options: ["(A) and then", "(B) so that", "(C) but also", "(D) and yet"], correct: 3, exp: "答案: (D) and yet。\n💡 解析：and yet (然而)，表語意轉折。他知道自己回不了家，但心中掛念的卻依然是弟弟與狗狗，展現無私。" }
                ]
            },
            {
                title: "Cloze 2: The Marshmallow Challenge (第41-45題)",
                intro: "Promoted by Tom Wujec, the Marshmallow Challenge is a team-building exercise [41] participants range from professionals, such as architects and engineers, to business school graduates and even kindergarteners. The Marshmallow Challenge tasks its participants with building the tallest free-standing structure using spaghetti sticks, tape, string, and a marshmallow within an 18-minute timeframe, revealing surprising insights into teamwork and problem-solving. In Wujec's study, across the diverse groups, architects and engineers, [42], won the championship as a result of their professional training. In contrast, business graduates [43] the last despite planning meticulously and adhering to structured analyses. Kindergarteners amazingly outperformed business graduates. The outcome of the former group was much more impressive than [44] of the latter one. [45] main reason for such success was that business graduates wasted too much time deciding who was in charge, whereas kindergarteners were more focused on working on unique ideas to figure out how to solve problems collaboratively. The trial-and-error approach they adopted helped them identify and fix design flaws within the time limit and finally achieved the second best performance.",
                questions: [
                    { id: 41, options: ["(A) that", "(B) which", "(C) what", "(D) whose"], correct: 3, exp: "答案: (D) whose。\n💡 解析：先行詞為 exercise，後方名詞 participants 前需用所有格關係代名詞 whose（其參與者）。" },
                    { id: 42, options: ["(A) surprisingly", "(B) instead of", "(C) as expected", "(D) eventually"], correct: 2, exp: "答案: (C) as expected。\n💡 解析：as expected (正如預期地)。建築師與工程師因專業訓練得第一，乃意料之中的事。" },
                    { id: 43, options: ["(A) ranking", "(B) ranked", "(C) which rank", "(D) who ranked"], correct: 1, exp: "答案: (B) ranked。\n💡 解析：本句缺少主要子句動詞。business graduates (主詞) ranked the last (動詞過去式，敬陪末座)。" },
                    { id: 44, options: ["(A) those", "(B) these", "(C) that", "(D) this"], correct: 2, exp: "答案: (C) that。\n💡 解析：代名詞 that 用於指代前方不可數或單數名詞 the outcome。" },
                    { id: 45, options: ["(A) One", "(B) Another", "(C) Still another", "(D) The other"], correct: 0, exp: "答案: (A) One。\n💡 解析：One main reason for... 指「其中的一項主因是...」。" }
                ]
            },
            {
                title: "Cloze 3: Prometheus in Greek Mythology (第46-50題)",
                intro: "In Greek mythology, Prometheus is known [46] the Titan who defied Zeus by stealing fire and giving it to humanity, setting the stage for human civilization. He created human beings out of clay. His brother Epimetheus then gave all living creatures on earth different qualities. By the time Epimetheus got to human beings, he [47] out of gifts. To compensate for their weaker state, Prometheus enabled them to stand upright like the gods. Not only kind but generous, he gave them fire to keep warm, cook food, and make tools. This act of generosity ended up bringing him into conflict with Zeus, the supreme ruler of the Olympian gods. Prometheus's defiance reached its zenith at Mecone, where all-powerful gods and vulnerable humans met to decide on the [48] of sacrifices. Prometheus wittingly deceived Zeus for the good of humans, offering the god a choice between two disguised portions of a(n) [49] bull. Zeus, misled by the outward appearance of the offering, selected a pile of bones hidden underneath gleaming fat, leaving the meat for human consumption. Zeus later retaliated by stripping humankind of fire. [50] Prometheus stole fire from the sun, returning it to mortals, thus restoring their ability to survive and progress.",
                questions: [
                    { id: 46, options: ["(A) to", "(B) for", "(C) as", "(D) by"], correct: 2, exp: "答案: (C) as。\n💡 解析：be known as + 身分/職位，在此指「以身為違抗宙斯的泰坦神祇而聞名」。" },
                    { id: 47, options: ["(A) ran", "(B) had run", "(C) was run", "(D) had been run"], correct: 1, exp: "答案: (B) had run。\n💡 解析：由 \"By the time + 過去式動詞 (got)\" 引導時間子句，主句動作發生在更早的過去，故用過去完成式 had run out of。" },
                    { id: 48, options: ["(A) corporation", "(B) distribution", "(C) reception", "(D) anticipation"], correct: 1, exp: "答案: (B) distribution。\n💡 解析：distribution of sacrifices 指祭品肉品與骨頭的「分配/分發」。" },
                    { id: 49, options: ["(A) slaughtered", "(B) tortured", "(C) adjusted", "(D) promised"], correct: 0, exp: "答案: (A) slaughtered。\n💡 解析：a slaughtered bull 指「一頭被宰殺的公牛（用於獻祭）」。" },
                    { id: 50, options: ["(A) After all", "(B) However", "(C) In spite", "(D) Moreover"], correct: 1, exp: "答案: (B) However。\n💡 解析：However (然而)。宙斯奪走火種報復，然而普羅米修斯再度冒險偷火相贈。" }
                ]
            },
            {
                title: "Cloze 4: Poleward Migration of Fish (第51-55題)",
                intro: "You may have heard that many land animals are forced to relocate because of climate change. But did you know that fish are also [51] ? Over 90 percent of the heat trapped by greenhouse gases over the last 50 years has been absorbed by the oceans. As the oceans heat up, the fish populations cannot [52] the changing temperature of the water around them. [53] tropical fish are being found in the temperate zones, and temperate fish are heading to the poles. This poleward migration is having a significant economic impact. In Iceland, for instance, rising ocean temperatures have caused capelin, the fish known for its tiny orange roe highly valued in Japan, [54] northward, leaving Icelandic waters. In 2018 and 2019, the capelin population dropped so low that the fish harvest had to be canceled, causing a major economic [55] as the harvest was valued at $143 million.",
                questions: [
                    { id: 51, options: ["(A) in a flash", "(B) on the move", "(C) in a row", "(D) on the rise"], correct: 1, exp: "答案: (B) on the move。\n💡 解析：on the move 指「在遷移/移動中」，呼應前一句動物 forced to relocate。" },
                    { id: 52, options: ["(A) back up", "(B) cut across", "(C) adapt to", "(D) wipe out"], correct: 2, exp: "答案: (C) adapt to。\n💡 解析：adapt to the temperature 指「適應水溫變化」。" },
                    { id: 53, options: ["(A) As a result", "(B) On the one hand", "(C) In a word", "(D) Most of all"], correct: 0, exp: "答案: (A) As a result。\n💡 解析：As a result (因此/結果)。魚類無法適應，導致熱帶魚往溫帶跑、溫帶魚往兩極遷徙。" },
                    { id: 54, options: ["(A) to migrate", "(B) migrate", "(C) and migrated", "(D) migrating"], correct: 0, exp: "答案: (A) to migrate。\n💡 解析：cause + O + to V (導致某事物去從事...)，故選 to migrate。" },
                    { id: 55, options: ["(A) relief", "(B) boost", "(C) recovery", "(D) blow"], correct: 3, exp: "答案: (D) blow。\n💡 解析：a major economic blow 指「一次嚴重的經濟重創/打擊」。" }
                ]
            }
        ];

        const contextPassageQuestions = [
            { id: 56, text: "Three-dimensional printing has revolutionized medical [56], ecology and construction.", correct: "AC", exp: "答案: (AC) care。\n💡 解析：medical care (醫療照護)。3D列印徹底革新了醫療、生態與建築。" },
            { id: 57, text: "artificial limbs can now be produced through 3D printing, allowing them to be [57] at relatively cheap prices.", correct: "BC", exp: "答案: (BC) available。\n💡 解析：allowing them to be available at cheap prices (使義肢能以便宜親民的價格取得)。" },
            { id: 58, text: "chance at improving the [58] of their lives.", correct: "AE", exp: "答案: (AE) quality。\n💡 解析：improve the quality of life (提升生活品質) 是重要且常見的高頻搭配詞。" },
            { id: 59, text: "These prosthetic limbs are [59] with sensors to help one move...", correct: "C", exp: "答案: (C) equipped。\n💡 解析：be equipped with 指「配備有...感測器」。" },
            { id: 60, text: "Another exciting [60] using 3D printers is creating artificial coral reefs...", correct: "A", exp: "答案: (A) development。\n💡 解析：Another exciting development 指「另一項令人振奮的重大進展」。" },
            { id: 61, text: "Precious underwater lives are now [61] in the Caribbean.", correct: "B", exp: "答案: (B) recovering。\n💡 解析：are now recovering 指「珍貴的海洋生物正在逐漸復原康復」。" },

                                                    const isCorrect = writingAns[idx].trim().toLowerCase() === q.answer.toLowerCase();
                                                    return (
                                                        <div key={q.id} className={`p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                                            <div className="flex justify-between items-center text-xs font-bold mb-1">
                                                                <span>題號 {q.id}</span>
                                                                <span className={isCorrect ? 'text-emerald-700' : 'text-rose-700'}>{isCorrect ? '✓ 拼寫正確' : '✕ 拼寫錯誤'}</span>
                                                            </div>
                                                            <div className="text-xs text-slate-700 mb-2">
                                                                學生輸入：<span className="font-mono font-bold">{writingAns[idx] || '未作答'}</span> ｜ 標準答案：<span className="font-mono font-bold text-emerald-700">{q.answer}</span>
                                                            </div>
                                                            <div className="bg-white p-3 rounded-lg border text-xs text-slate-700 whitespace-pre-line leading-relaxed">
                                                                {q.exp}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* 86-92 Translation Review */}
                                    {(activeTab === 'all' || activeTab === 'trans') && (
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h3 className="text-lg font-bold text-slate-800 border-l-4 border-indigo-600 pl-3 mb-4">
                                                VIII. Translation (第 86-92 題) 詳解與評分指引
                                            </h3>
                                            
                                            {/* 86-91 */}
                                            <div className="space-y-3 mb-6">
                                                {translationBlanks.map((q, idx) => {
                                                    const studentInput = transBlankAns[idx].trim().toLowerCase().replace(/\s+/g, ' ');
                                                    const isCorrect = q.accepted.some(acc => studentInput === acc.toLowerCase());
                                                    return (
                                                        <div key={q.id} className={`p-3 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                                            <div className="flex justify-between text-xs font-bold mb-1">
                                                                <span>第 {q.id} 題 填空翻譯</span>
                                                                <span className={isCorrect ? 'text-emerald-700' : 'text-rose-700'}>{isCorrect ? '✓ 滿分' : '✕ 需訂正'}</span>
                                                            </div>
                                                            <p className="text-xs text-slate-800 mb-1">{q.cn}</p>
                                                            <div className="text-xs text-slate-700 mb-2">
                                                                你的作答：<span className="font-bold">{transBlankAns[idx] || '未填寫'}</span> ｜ 標準答案：<span className="font-bold text-emerald-700">{q.accepted.join(" / ")}</span>
                                                            </div>
                                                            <div className="bg-white p-2.5 rounded border text-xs text-slate-700 whitespace-pre-line leading-relaxed">
                                                                {q.exp}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            {/* 92 */}
                                            <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-xl">
                                                <h4 className="font-bold text-sm text-indigo-900 mb-2">第 92 題 整句翻譯 (4%) 權威評分與解析標準</h4>
                                                <p className="text-xs text-slate-800 font-semibold mb-2">{fullTranslation92.cn}</p>
                                                
                                                <div className="bg-white p-3 rounded-lg border text-xs text-slate-700 mb-3">
                                                    <span className="font-bold text-emerald-700">學生送交譯文：</span>
                                                    <p className="font-serif italic mt-1">{trans92Ans || '（無作答）'}</p>
                                                </div>

                                                <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-200 text-xs text-emerald-900 mb-3">
                                                    <span className="font-bold">名師標準參考答案：</span>
                                                    <p className="font-serif font-semibold mt-1">{fullTranslation92.ref}</p>
                                                </div>

                                                <div className="text-xs text-slate-700 space-y-1">
                                                    <span className="font-bold text-indigo-800">段考評分標準 (配分拆解)：</span>
                                                    {fullTranslation92.breakdown.map((item, bIdx) => (
                                                        <div key={bIdx} className="pl-2 border-l-2 border-indigo-400">{item}</div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                </div>

                            </div>
                        )}

                    </main>

                    {}
                    {modal.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 fade-in border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">{modal.title}</h3>
                                <p className="text-slate-600 text-sm mb-6 leading-relaxed">{modal.message}</p>
                                <div className="flex justify-end gap-3">
                                    {modal.type === 'confirm' && (
                                        <button
                                            type="button"
                                            onClick={closeModal}
                                            className="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
                                        >
                                            回到試卷檢查
                                        </button>
                                    )}
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (modal.onConfirm) modal.onConfirm();
                                            closeModal();
                                        }}
                                        className="px-5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow transition"
                                    >
                                        確定送出
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
